[project]
name = "ai-visibility-audit-api"
version = "0.3.1"
description = "AI Visibility Audit API — track brand visibility across AI assistants"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30",
    "alembic>=1.19.1",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28",
    "openai>=3.0.0",
    "exa-py>=2.18.0",
    "pgvector>=0.5.0",
    "huggingface-hub>=1.27.0",
    "pyarrow>=25.0.1",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
